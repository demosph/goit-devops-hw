controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: latest
    pullPolicy: IfNotPresent

  admin:
    username: admin
    password: admin123

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: true
    storageClass: "ebs-sc"
    size: 10Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  serviceAccount:
    name: jenkins-sa
    create: false

  JCasC:
    configScripts:
      dsl-security: |
        security:
          globalJobDslSecurityConfiguration:
            useScriptSecurity: false
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: demosph
                      password: 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
                      description: GitHub PAT
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('https://github.com/demosph/goit-devops-hw.git')
                      credentials('github-token')
                    }
                    branches('*/lesson-4')
                  }
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('https://github.com/demosph/goit-devops-hw.git')
                                  credentials("github-token")
                                }
                                branches("*/lesson-4")
                              }
                            }
                          }
                        }
                      }
                    ''')
                  }
                }
              }
